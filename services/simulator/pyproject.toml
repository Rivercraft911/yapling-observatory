[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "cubesat-link-simulator"
version = "0.1.0"
description = "Reproducible analytical CubeSat pass and RF studies with a local API"
requires-python = ">=3.11"
dependencies = ["fastapi>=0.115,<1", "pydantic>=2.9,<3", "uvicorn>=0.30,<1"]

[project.optional-dependencies]
dev = ["pytest>=8,<10", "httpx>=0.27,<1"]

[project.scripts]
cubesat-sim = "cubesat_sim.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.setuptools.package-data]
"cubesat_sim.power" = ["*.json"]
"cubesat_sim.mission" = ["*.json"]

"cubesat_sim.geomagnetism" = ["*.json", "*.txt"]
